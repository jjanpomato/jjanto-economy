<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>짠토🍅와 짠감🥔의 경제지표 공부</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body style="margin: 0; padding: 0; background-color: #F5EFE6;">

  <div id="root">
    <div style="padding: 50px; text-align: center; font-family: sans-serif; color: #8B6340;">
      <h2>🥔 감자 지표를 밭에서 캐고 있습니다... 잠시만요!</h2>
    </div>
  </div>

  <!-- Firebase: 구글 로그인 + 클라우드 저장 (여러 컴퓨터에서 같은 기록 보기) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvZOk7ppM63Kv4V_tsCziVKCmT-Jtp8kU",
      authDomain: "jjanto-economy.firebaseapp.com",
      projectId: "jjanto-economy",
      storageBucket: "jjanto-economy.firebasestorage.app",
      messagingSenderId: "1083873163094",
      appId: "1:1083873163094:web:f4db2fe725f6aca40388f7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // 인터넷이 잠깐 끊겨도 마지막으로 받은 기록을 보여주도록 브라우저에 캐시
    let db;
    try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
    catch (e) { db = initializeFirestore(app, {}); }

    // Firestore 문서 이름에는 "/"를 쓸 수 없어서 "2026-09-29" 형태로 저장
    const docId = date => date.replace(/\//g, "-");
    const recordsCol = uid => collection(db, "users", uid, "records");
    const recordDoc = (uid, date) => doc(db, "users", uid, "records", docId(date));
    const clean = rec => JSON.parse(JSON.stringify(rec)); // undefined 값 제거

    async function commitInChunks(ops) {
      for (let i = 0; i < ops.length; i += 400) {
        const batch = writeBatch(db);
        ops.slice(i, i + 400).forEach(op => op(batch));
        await batch.commit();
      }
    }

    window.fb = {
      onAuth: cb => onAuthStateChanged(auth, cb),
      login: () => signInWithPopup(auth, new GoogleAuthProvider()),
      logout: () => signOut(auth),
      watchRecords: (uid, onData, onError) => onSnapshot(recordsCol(uid), snap => onData(snap.docs.map(d => d.data())), onError),
      putRecord: (uid, rec) => setDoc(recordDoc(uid, rec.date), clean(rec)),
      removeRecord: (uid, date) => deleteDoc(recordDoc(uid, date)),
      putMany: (uid, recs) => commitInChunks(recs.map(r => b => b.set(recordDoc(uid, r.date), clean(r)))),
      removeMany: (uid, dates) => commitInChunks(dates.map(d => b => b.delete(recordDoc(uid, d))))
    };
    window.dispatchEvent(new Event("fb-ready"));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

    // 지수(S&P500·나스닥·다우·코스피·코스닥)는 '포인트'라서 단위 없음. 금·유가는 달러 가격.
    const SECTIONS = [
      { id: "us", label: "미국시장", icon: "🍅", items: [{ key: "sp", label: "S&P 500", unit: "" }, { key: "nasdaq", label: "나스닥", unit: "" }, { key: "dow", label: "다우존스", unit: "" }] },
      { id: "kr", label: "국내시장", icon: "🥔", items: [{ key: "kospi", label: "코스피", unit: "" }, { key: "kosdaq", label: "코스닥", unit: "" }] },
      { id: "etc", label: "기타지표", icon: "🍅", items: [{ key: "usdkrw", label: "원/달러", unit: "₩" }, { key: "btc", label: "비트코인", unit: "₩" }, { key: "gold", label: "금", unit: "$" }, { key: "oil", label: "유가", unit: "$" }] }
    ];

    const ALL_ITEMS = []; SECTIONS.forEach(s => ALL_ITEMS.push(...s.items));
    const ALL_KEYS = ALL_ITEMS.map(i => i.key);
    const initVals = {}; const initCls = {};
    ALL_KEYS.forEach(k => { initVals[k] = ""; initCls[k] = false; });

    // CNN 공포탐욕지수 구간: 0–24 / 25–44 / 45–55 / 56–75 / 76–100
    const FNG_LEVELS = [
      { min: 0, max: 24, label: "극단적 공포", color: "#E05A2B" }, { min: 25, max: 44, label: "공포", color: "#E09B3D" },
      { min: 45, max: 55, label: "중립", color: "#D4C53A" }, { min: 56, max: 75, label: "탐욕", color: "#8CC63F" },
      { min: 76, max: 100, label: "극단적 탐욕", color: "#3AAD5E" }
    ];
    const FNG_EDGES = [0, 25, 45, 55, 75, 100]; // 게이지에 그리는 구간 경계

    const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
    const pad2 = n => String(n).padStart(2, "0");

    // ---------- 날짜 도우미 (저장 형식: "YYYY/MM/DD") ----------
    function parseInputDate(dateStr) {
      if (!dateStr) return null;
      const parts = String(dateStr).split(/[\/\-.]/).map(s => s.trim()).filter(Boolean);
      if (parts.length !== 3) return null;
      let [y, m, d] = parts;
      if (y.length === 2) y = "20" + y;
      const dt = new Date(+y, +m - 1, +d);
      return isNaN(dt.getTime()) ? null : dt;
    }
    function toDateStr(d) { return `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`; }
    function normDate(s) { const d = parseInputDate(s); return d ? toDateStr(d) : s; }
    function todayStr() { return toDateStr(new Date()); }
    function shortLabel(d) { return `${String(d.getFullYear()).slice(2)}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}(${WEEKDAYS[d.getDay()]})`; }
    function mmdd(dateStr) { const d = parseInputDate(dateStr); return d ? `${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}` : dateStr; }
    function weekdayLabel(dateStr) { const d = parseInputDate(dateStr); return d ? WEEKDAYS[d.getDay()] : ""; }
    function isWeekend(dateStr) { const d = parseInputDate(dateStr); return !!d && (d.getDay() === 0 || d.getDay() === 6); }
    // 직전 평일: 월요일이면 금요일
    function prevWeekday(d) {
      const x = new Date(d);
      do { x.setDate(x.getDate() - 1); } while (x.getDay() === 0 || x.getDay() === 6);
      return x;
    }
    // 한국 기록일 기준 → 미국은 직전 평일 마감
    function usBasisLabel(dateStr) { const d = parseInputDate(dateStr); return d ? shortLabel(prevWeekday(d)) : ""; }
    function krBasisLabel(dateStr) { const d = parseInputDate(dateStr); return d ? shortLabel(d) : ""; }

    // ---------- 숫자 도우미 ----------
    function getFng(val) {
      const n = parseInt(val); if (isNaN(n) || val === "") return null;
      const clamped = Math.min(100, Math.max(0, n));
      return { ...(FNG_LEVELS.find(l => clamped <= l.max) || FNG_LEVELS[4]), value: clamped };
    }
    function parseNum(s) { return parseFloat(String(s || "").replace(/,/g, "")) || 0; }
    function hasVal(key, v) {
      if (key === "fng") return String(v ?? "").trim() !== "" && !isNaN(parseInt(v));
      return parseNum(v) !== 0;
    }
    function calcChg(cur, prev) {
      const c = parseNum(cur), p = parseNum(prev); if (!c || !p) return null;
      return ((c - p) / p * 100).toFixed(2);
    }
    function fmtVal(val, unit) {
      const n = parseNum(val); if (!n) return "–";
      if (unit === "₩" && n > 1000000) return `₩${(n / 1000000).toFixed(2)}M`;
      if (unit === "$") return `$${n.toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
      if (unit === "₩") return `₩${n.toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
      return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
    }

    // ---------- 기록 도우미 ----------
    function sortRecords(list) { return [...list].sort((a, b) => a.date.localeCompare(b.date)); }

    // 날짜 형식을 맞추고, 같은 날짜가 여러 개면 마지막 것만 남김
    function normalizeRecords(list) {
      if (!Array.isArray(list)) return null;
      const map = new Map();
      list.forEach(r => {
        if (!r || typeof r.date !== "string") return;
        const date = normDate(r.date);
        map.set(date, { ...r, date, values: r.values || {}, closed: r.closed || {}, fng: r.fng ?? "", memo: r.memo ?? "" });
      });
      return sortRecords([...map.values()]);
    }

    // date 이전 기록 중, 휴장이 아니고 값이 입력된 가장 최근 값 (= 직전 거래일 값)
    function lastValueBefore(sortedRecs, date, key) {
      for (let i = sortedRecs.length - 1; i >= 0; i--) {
        const r = sortedRecs[i];
        if (r.date >= date) continue;
        const v = key === "fng" ? r.fng : r.values?.[key];
        if (!r.closed?.[key] && hasVal(key, v)) return { value: v, date: r.date };
      }
      return null;
    }

    function loadRecordsFromStorage() {
      try {
        const saved = localStorage.getItem("jjanto_records");
        return (saved && normalizeRecords(JSON.parse(saved))) || [];
      } catch (e) {
        return [];
      }
    }

    // Firebase 모듈이 준비되면 알려줌 (불러오지 못하면 이 컴퓨터 저장만 사용)
    function useFirebase() {
      const [fb, setFb] = useState(window.fb || null);
      const [failed, setFailed] = useState(false);
      useEffect(() => {
        if (window.fb) return;
        const onReady = () => setFb(window.fb);
        window.addEventListener("fb-ready", onReady);
        const t = setTimeout(() => { if (!window.fb) setFailed(true); }, 10000);
        return () => { window.removeEventListener("fb-ready", onReady); clearTimeout(t); };
      }, []);
      return { fb, failed };
    }

    function AccountBox({ fb, fbFailed, user, onLogin, onLogout }) {
      const btn = { padding: "6px 10px", borderRadius: 8, fontSize: 11, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap", fontFamily: "Inter,sans-serif" };
      if (fbFailed) return <span style={{ fontSize: 10, color: "#C8B0A0", fontWeight: 600 }}>☁️ 연결 안 됨</span>;
      if (!fb || user === undefined) return <span style={{ fontSize: 10, color: "#C8B0A0", fontWeight: 600 }}>☁️ 확인 중…</span>;
      if (!user) return <button onClick={onLogin} style={{ ...btn, border: "none", background: "#8B6340", color: "#fff" }}>구글 로그인</button>;
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ fontSize: 10, color: "#3AAD5E", fontWeight: 700, whiteSpace: "nowrap" }}>☁️ 클라우드 저장</span>
          <button onClick={onLogout} style={{ ...btn, border: "1px solid #E8DDD0", background: "#FBF6EF", color: "#B09880" }}>로그아웃</button>
        </div>
      );
    }

    // ---------- 작은 표시 컴포넌트 ----------
    function ChgBadge({ chg }) {
      if (chg === null) return <span style={{ color: "#B09880", fontSize: 12 }}>–</span>;
      const num = +chg;
      if (num === 0) return <span style={{ color: "#8B6340", fontWeight: 700, fontSize: 12 }}>0.00%</span>;
      const up = num > 0;
      return <span style={{ color: up ? "#C0392B" : "#3B6EA5", fontWeight: 700, fontSize: 12 }}>{up ? "▲" : "▼"} {up ? "+" : ""}{chg}%</span>;
    }
    function MarketTag({ chg }) {
      if (chg === null || +chg === 0) return null;
      const up = +chg > 0;
      return <span style={{ fontSize: 10, fontWeight: 700, padding: "2px 7px", borderRadius: 20, background: up ? "#FDE8E5" : "#E8EEF8", color: up ? "#C0392B" : "#3B6EA5" }}>{up ? "상승" : "하락"}</span>;
    }

    // CNN 공포탐욕지수 구간(0·25·45·55·75·100)과 색 구간을 똑같이 맞춤
    // change: { diff, label } 가 있으면 숫자 아래에 "전일 대비 ▼ 3p"를 표시
    function FearGreedGauge({ value, change }) {
      const info = getFng(value); if (!info) return null;
      const W = 260, H = 150, cx = 130, cy = 132, R = 100, rIn = 66;
      const toDeg = v => (v / 100) * 180;
      function pt(deg, r) { const rad = Math.PI * deg / 180; return { x: cx - r * Math.cos(rad), y: cy - r * Math.sin(rad) }; }
      function arc(a1, a2, ro, ri) {
        const s1 = pt(a1, ro), e1 = pt(a2, ro), s2 = pt(a2, ri), e2 = pt(a1, ri);
        return `M${s1.x} ${s1.y} A${ro} ${ro} 0 0 1 ${e1.x} ${e1.y} L${s2.x} ${s2.y} A${ri} ${ri} 0 0 0 ${e2.x} ${e2.y}Z`;
      }
      const segments = FNG_LEVELS.map((l, i) => ({ from: FNG_EDGES[i], to: FNG_EDGES[i + 1], color: l.color, active: l.label === info.label }));
      const needleDeg = toDeg(info.value);
      const tip = pt(needleDeg, R + 2), b1 = pt(needleDeg + 90, 4), b2 = pt(needleDeg - 90, 4);
      const marker = pt(needleDeg, (R + rIn) / 2);

      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: "100%" }}>
          <svg width={W} height={H} style={{ display: "block" }}>
            {segments.map((sg, i) => <path key={i} d={arc(toDeg(sg.from), toDeg(sg.to), R, rIn)} fill={sg.color} opacity={sg.active ? 1 : 0.28} stroke="#fff" strokeWidth={2} />)}
            {FNG_EDGES.map(v => { const p = pt(toDeg(v), R + 13); return <text key={v} x={p.x} y={p.y + 3} textAnchor="middle" fontSize={10} fontWeight={600} fill="#B09880" fontFamily="Inter, sans-serif">{v}</text>; })}
            <polygon points={`${tip.x},${tip.y} ${b1.x},${b1.y} ${b2.x},${b2.y}`} fill="#2C1A0E" />
            <circle cx={cx} cy={cy} r={7} fill="#2C1A0E" />
            <circle cx={marker.x} cy={marker.y} r={9} fill={info.color} stroke="#fff" strokeWidth={3} />
          </svg>
          <div style={{ marginTop: 4, textAlign: "center", lineHeight: 1 }}>
            <span style={{ fontSize: 40, fontWeight: 800, color: "#2C1A0E", fontFamily: "Inter, sans-serif", letterSpacing: "-1px" }}>{info.value}</span>
            <span style={{ fontSize: 14, fontWeight: 700, color: "#B09880", marginLeft: 3 }}>/ 100</span>
          </div>
          {change && (
            <div style={{ marginTop: 8, fontSize: 13, fontWeight: 800, color: change.diff > 0 ? UP_COLOR : change.diff < 0 ? DOWN_COLOR : "#B09880" }}>
              <span style={{ fontSize: 11, fontWeight: 700, color: "#B09880", marginRight: 5 }}>{change.label}</span>
              {change.diff > 0 ? `▲ ${change.diff}p 상승` : change.diff < 0 ? `▼ ${Math.abs(change.diff)}p 하락` : "변동 없음"}
            </div>
          )}
          <div style={{ marginTop: 8, fontSize: 13, fontWeight: 800, color: "#fff", background: info.color, padding: "4px 12px", borderRadius: 20 }}>{info.label}</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "center", marginTop: 12 }}>
            {FNG_LEVELS.map(l => (
              <span key={l.label} style={{ display: "flex", alignItems: "center", gap: 3, fontSize: 10, fontWeight: l.label === info.label ? 800 : 600, color: l.label === info.label ? "#2C1A0E" : "#B09880" }}>
                <span style={{ width: 8, height: 8, borderRadius: 2, background: l.color, opacity: l.label === info.label ? 1 : 0.45 }} />
                {l.label} {l.min}–{l.max}
              </span>
            ))}
          </div>
        </div>
      );
    }

    // 캡처 영역을 PNG로 저장 (등락 비교·주간 탭 공통)
    async function saveAsImage(node, filename) {
      if (!node) return;
      try {
        const canvas = await window.html2canvas(node, { scale: 3, backgroundColor: "#F5EFE6", logging: false });
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        console.error("이미지 저장 실패", err);
        alert("이미지 저장에 실패했습니다.");
      }
    }

    const UP_COLOR = "#C0392B", DOWN_COLOR = "#3B6EA5", FLAT_COLOR = "#8B6340";

    // 휴장 체크 시: 직전에 입력된 값을 날짜와 함께 보여줌 (값을 복사해서 저장하지는 않음)
    function ClosedInfo({ prevInfo, unit }) {
      return (
        <div style={{ fontSize: 11, color: "#C8B0A0", fontWeight: 600 }}>
          휴장 · {prevInfo
            ? <>이전 값 <b style={{ color: "#8B6340" }}>{fmtVal(prevInfo.value, unit)}</b> ({mmdd(prevInfo.date)} 기록)</>
            : "이전 기록 없음"}
        </div>
      );
    }

    function InputCard({ it, isClosed, value, onToggle, onChange, prevInfo }) {
      return (
        <div style={{ background: isClosed ? "#F9F5F0" : "#FBF6EF", borderRadius: 12, padding: "11px 13px", border: "1.5px solid #EDE4D8", flex: "1 1 calc(50% - 5px)", minWidth: 0 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
            <span style={{ fontSize: 11, color: "#8B6340", fontWeight: 700 }}>{it.label}</span>
            <label style={{ display: "flex", alignItems: "center", gap: 3, cursor: "pointer", fontSize: 10, color: "#B09880" }}>
              <input type="checkbox" checked={isClosed} onChange={onToggle} style={{ accentColor: "#C0392B", width: 11, height: 11 }} /> 휴장
            </label>
          </div>
          {isClosed ? <ClosedInfo prevInfo={prevInfo} unit={it.unit} />
            : <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                {it.unit && <span style={{ fontSize: 12, color: "#B09880" }}>{it.unit}</span>}
                <input value={value} onChange={e => onChange(e.target.value)} placeholder="0" style={{ flex: 1, border: "none", background: "transparent", fontSize: 14, fontWeight: 700, color: "#2C1A0E", fontFamily: "Inter,sans-serif", minWidth: 0, outline: "none" }} />
              </div>}
        </div>
      );
    }

    function CompareTab({ records }) {
      const captureRef = useRef(null);

      if (records.length === 0) return ( <div style={{ textAlign: "center", padding: "48px 20px", color: "#B09880" }}><div style={{ fontSize: 32, marginBottom: 12 }}>📅</div><div style={{ fontSize: 14, fontWeight: 600 }}>아직 기록이 없어요</div><div style={{ fontSize: 13, marginTop: 4 }}>입력 탭에서 오늘 기록을 저장해보세요!</div></div> );

      const sorted = sortRecords(records);
      const cur = sorted[sorted.length - 1];
      const prevRecDate = sorted.length > 1 ? sorted[sorted.length - 2].date : null;

      // 지표 하나의 상태: 거래(open) / 휴장(closed) / 입력 없음(empty)
      function itemState(rec, key) {
        const v = rec.values?.[key];
        if (rec.closed?.[key]) return { status: "closed", last: lastValueBefore(sorted, rec.date, key) };
        if (!hasVal(key, v)) return { status: "empty" };
        const prev = lastValueBefore(sorted, rec.date, key);
        return { status: "open", value: v, chg: prev ? calcChg(v, prev.value) : null, prevDate: prev?.date };
      }

      const fngClosed = !!cur.closed?.fng;
      const fngLast = fngClosed ? lastValueBefore(sorted, cur.date, "fng") : null;
      const fngVal = fngClosed ? fngLast?.value : cur.fng;
      // 공포탐욕지수 전일 대비 (휴장이면 표시 안 함, 바로 전 기록이 아니면 "MM/DD 대비")
      const fngPrev = !fngClosed && hasVal("fng", cur.fng) ? lastValueBefore(sorted, cur.date, "fng") : null;
      const fngChange = fngPrev ? {
        diff: parseInt(cur.fng) - parseInt(fngPrev.value),
        label: fngPrev.date === prevRecDate ? "전일 대비" : `${mmdd(fngPrev.date)} 대비`
      } : null;

      const handleDownloadImage = () => saveAsImage(captureRef.current, `경제지표_요약_${cur.date.replace(/\//g, "")}.png`);

    // ---------- 주간 탭 ----------
    // 날짜가 속한 주의 월~금 (기록 날짜 형식)
    function weekDays(dateStr) {
      const d = parseInputDate(dateStr) || new Date();
      const mon = new Date(d);
      mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      return [0, 1, 2, 3, 4].map(i => { const x = new Date(mon); x.setDate(mon.getDate() + i); return toDateStr(x); });
    }
    function numOf(key, v) { return key === "fng" ? parseInt(v) : parseNum(v); }

    const WEEK_ITEMS = [...ALL_ITEMS, { key: "fng", label: "CNN 지수", unit: "" }];

    function MiniTip({ active, payload, unit }) {
      if (!active || !payload?.length || payload[0].value == null) return null;
      const p = payload[0].payload;
      return (
        <div style={{ background: "#fff", border: "1px solid #F0E8DC", borderRadius: 8, padding: "5px 8px", boxShadow: "0 4px 12px rgba(0,0,0,0.08)", fontSize: 11, color: "#2C1A0E", fontWeight: 700 }}>
          <div style={{ color: "#B09880", fontWeight: 600 }}>{mmdd(p.date)}({p.day})</div>
          {fmtVal(p.v, unit)}
        </div>
      );
    }

    function WeekCard({ it, sorted, days, recMap, full }) {
      const points = days.map((d, i) => {
        const r = recMap.get(d);
        const v = key => key === "fng" ? r?.fng : r?.values?.[key];
        const ok = r && !r.closed?.[it.key] && hasVal(it.key, v(it.key));
        return { day: WEEKDAYS[i + 1], date: d, v: ok ? numOf(it.key, v(it.key)) : null };
      });
      const filled = points.filter(p => p.v != null);
      const last = filled[filled.length - 1];
      const prevWeek = lastValueBefore(sorted, days[0], it.key);
      const base = prevWeek ? { v: numOf(it.key, prevWeek.value), date: prevWeek.date } : (filled.length > 1 ? filled[0] : null);
      let chg = null;
      if (last && base && base.v) {
        chg = it.key === "fng" ? last.v - base.v : +((last.v - base.v) / base.v * 100).toFixed(2);
      }
      // 값이 하나뿐이거나 변화가 없어도 선이 가운데 오도록 위아래 여백
      const vals = filled.map(p => p.v);
      const lo = Math.min(...vals), hi = Math.max(...vals);
      const pad = (hi - lo) * 0.15 || Math.abs(hi) * 0.01 || 1;
      const domain = [lo - pad, hi + pad];
      const color = chg == null || chg === 0 ? FLAT_COLOR : chg > 0 ? UP_COLOR : DOWN_COLOR;
      const chgText = chg == null ? "–" : it.key === "fng"
        ? `${chg > 0 ? "▲ +" : chg < 0 ? "▼ " : ""}${chg}p`
        : `${chg > 0 ? "▲ +" : chg < 0 ? "▼ " : ""}${chg.toFixed(2)}%`;

      return (
        <div style={{ borderRadius: 12, padding: "11px 12px 6px", border: "1.5px solid #F0E8DC", background: "#fff", flex: full ? "1 1 100%" : "1 1 calc(50% - 4px)", minWidth: 0 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 6 }}>
            <span style={{ fontSize: 10, color: "#B09880", fontWeight: 600 }}>{it.label}</span>
            <span style={{ fontSize: 11, fontWeight: 800, color: chg == null || chg === 0 ? "#B09880" : color }}>{chgText}</span>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 6, marginTop: 2 }}>
            <span style={{ fontSize: 14, fontWeight: 800, color: "#2C1A0E" }}>{last ? fmtVal(last.v, it.unit) : "–"}</span>
            {base && !prevWeek && chg != null && <span style={{ fontSize: 9, color: "#B09880", fontWeight: 600 }}>{mmdd(base.date)} 대비</span>}
          </div>
          {filled.length === 0 ? (
            <div style={{ height: 64, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, color: "#C8B0A0", fontWeight: 600 }}>이번 주 기록 없음</div>
          ) : (
            <ResponsiveContainer width="100%" height={64}>
              <LineChart data={points} margin={{ top: 8, right: 6, bottom: 0, left: 6 }}>
                <XAxis dataKey="day" tick={{ fontSize: 10, fill: "#B09880" }} axisLine={false} tickLine={false} interval={0} height={16} />
                <YAxis hide domain={domain} />
                <Tooltip content={<MiniTip unit={it.unit} />} cursor={{ stroke: "#E8DDD0", strokeWidth: 1 }} />
                <Line type="linear" dataKey="v" stroke={color} strokeWidth={2} connectNulls isAnimationActive={false}
                  dot={{ r: 3, fill: color, stroke: "#fff", strokeWidth: 1.5 }} activeDot={{ r: 5, fill: color, stroke: "#fff", strokeWidth: 2 }} />
              </LineChart>
            </ResponsiveContainer>
          )}
        </div>
      );
    }

      const [anchor, setAnchor] = useState(sorted.length ? sorted[sorted.length - 1].date : todayStr());
      const captureRef = useRef(null);

      return (

          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 12 }}>

              <button onClick={() => shiftWeek(-1)} style={navBtn}>◀</button>
              <button onClick={() => shiftWeek(1)} disabled={days[0] >= thisWeekStart} style={{ ...navBtn, opacity: days[0] >= thisWeekStart ? 0.4 : 1, cursor: days[0] >= thisWeekStart ? "default" : "pointer" }}>▶</button>
            </div>
            <button onClick={() => saveAsImage(captureRef.current, `경제지표_주간_${days[0].replace(/\//g, "")}.png`)} disabled={!hasAny} style={{ padding: "8px 14px", borderRadius: 8, border: "none", background: "#8B6340", color: "#fff", fontSize: 12, fontWeight: 700, cursor: hasAny ? "pointer" : "default", opacity: hasAny ? 1 : 0.4, boxShadow: "0 2px 6px rgba(0,0,0,0.1)" }}>
              📸 주간 이미지 저장
            </button>
          </div>

          {/* 캡처될 영역 시작 */}
          <div ref={captureRef} style={{ padding: "20px 10px", background: "#F5EFE6", margin: "-20px -10px 0" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 6 }}>
              <div style={{ fontSize: 20 }}>🍅</div>
              <div style={{ fontSize: 16, fontWeight: 800, color: "#2C1A0E", letterSpacing: "-0.5px" }}>짠토와 짠감의 주간 경제지표</div>
              <div style={{ fontSize: 20 }}>🥔</div>
            </div>
            <div style={{ textAlign: "center", fontSize: 12, fontWeight: 700, color: "#8B6340", marginBottom: 16 }}>{rangeLabel}</div>

            {!hasAny ? (
              <div style={{ textAlign: "center", padding: "40px 20px", color: "#B09880", background: "#fff", borderRadius: 16, border: "1px solid #F0E8DC" }}>
                <div style={{ fontSize: 32, marginBottom: 10 }}>📭</div>
                <div style={{ fontSize: 14, fontWeight: 600 }}>이 주에는 기록이 없어요</div>
              </div>
            ) : (
              <div style={{ background: "#fff", borderRadius: 16, padding: "18px", border: "1px solid #F0E8DC", marginBottom: 14, boxShadow: "0 2px 12px rgba(0,0,0,0.04)" }}>
                <div style={{ fontSize: 12, color: "#B09880", marginBottom: 14, fontWeight: 600 }}>📈 주간 흐름 · 오른쪽 숫자는 지난주 마지막 기록 대비</div>
                {[...SECTIONS, { id: "fng", label: "공포 탐욕지수", icon: "🥔", items: [WEEK_ITEMS[WEEK_ITEMS.length - 1]] }].map(sec => (
                  <div key={sec.id} style={{ marginBottom: 14 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
                      <span style={{ fontSize: 16 }}>{sec.icon}</span>
                      <span style={{ fontSize: 11, fontWeight: 700, color: "#B09880" }}>{sec.label}</span>
                    </div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                      {sec.items.map((it, idx) => (
                        <WeekCard key={it.key} it={it} sorted={sorted} days={days} recMap={recMap} full={sec.items.length % 2 === 1 && idx === sec.items.length - 1} />
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            <div style={{ textAlign: "center", fontSize: 10, color: "#B09880", lineHeight: 1.7, marginTop: 2 }}>
              출처: 네이버증권 · CNN Fear &amp; Greed Index<br />
              요일은 기록일 기준 · 미국 지수는 전날 미국 마감 값
            </div>
          </div>
          {/* 캡처될 영역 끝 */}
        </div>
      );
    }

    function WeekendNotice({ inputDate, onPrevWeekday, onNextWeekday }) {
      return (
        <div style={{ background: "#fff", borderRadius: 14, padding: "36px 20px", border: "1px solid #F0E8DC", marginBottom: 14, boxShadow: "0 2px 8px rgba(0,0,0,0.04)", textAlign: "center" }}>
          <div style={{ fontSize: 34, marginBottom: 10 }}>🍅😴🥔</div>
          <div style={{ fontSize: 15, fontWeight: 800, color: "#2C1A0E", marginBottom: 6 }}>{inputDate} ({weekdayLabel(inputDate)}) 미장·국장 모두 휴장이에요</div>
          <div style={{ fontSize: 12, color: "#B09880", lineHeight: 1.6, marginBottom: 18 }}>
            주말은 기록할 시장 데이터가 없으니<br/>짠토랑 짠감이도 쉬어가요 🍅🥔
          </div>
          <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
            <button onClick={onPrevWeekday} style={{ padding: "8px 14px", borderRadius: 8, border: "1px solid #E8DDD0", background: "#FBF6EF", color: "#8B6340", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>← 지난 평일 기록</button>
            <button onClick={onNextWeekday} style={{ padding: "8px 14px", borderRadius: 8, border: "none", background: "linear-gradient(135deg,#E8392A,#C8650A)", color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>다음 평일로 →</button>
          </div>
        </div>
      );
    }

    function App() {
      // 로그인 전: 이 컴퓨터(localStorage) 기록 / 로그인 후: 클라우드(Firebase) 기록
      const [localRecords, setLocalRecords] = useState(loadRecordsFromStorage);
      const { fb, failed: fbFailed } = useFirebase();
      const [user, setUser] = useState(undefined); // undefined = 확인 중, null = 로그아웃
      const [cloudRecords, setCloudRecords] = useState(null);
      const cloudOn = !!user;
      const records = cloudOn ? (cloudRecords || []) : localRecords;
      const cloudLoading = cloudOn && cloudRecords === null;

      const [tab, setTab]             = useState("input");
      const [inputDate, setInputDate] = useState(todayStr());
      const [values, setValues]       = useState({ ...initVals });
      const [closed, setClosed]       = useState({ ...initCls });
      const [fng, setFng]             = useState("");
      const [fngClosed, setFngClosed] = useState(false);
      const [memo, setMemo]           = useState("");
      const [saved, setSaved]         = useState(false);
      const fileInputRef = useRef(null);

      useEffect(() => {
        try { localStorage.setItem("jjanto_records", JSON.stringify(localRecords)); }
        catch (e) { alert("브라우저에 저장하지 못했어요. 백업 파일을 저장해두세요."); }
      }, [localRecords]);

      useEffect(() => { if (fb) return fb.onAuth(u => setUser(u || null)); }, [fb]);

      useEffect(() => {
        setCloudRecords(null);
        if (!fb || !user) return;
        return fb.watchRecords(user.uid,
          list => setCloudRecords(normalizeRecords(list) || []),
          err => { console.error(err); alert("클라우드 기록을 불러오지 못했어요.\n" + err.message); });
      }, [fb, user]);

      const fillForm = r => {
        setInputDate(r.date);
        setValues({ ...initVals, ...r.values });
        setClosed({ ...initCls, ...r.closed });
        setFng(r.fng || "");
        setFngClosed(!!r.closed?.fng);
        setMemo(r.memo || "");
      };
      const resetForm = date => {
        setInputDate(date); setValues({ ...initVals }); setClosed({ ...initCls });
        setFng(""); setFngClosed(false); setMemo("");
      };
      // 날짜를 고르면: 저장된 기록이 있으면 불러오고, 없으면 빈 칸으로 시작
      const goToDate = dateStr => {
        const date = normDate(dateStr);
        const existing = records.find(r => r.date === date);
        if (existing) fillForm(existing); else resetForm(date);
      };

      // 처음 열 때 오늘 기록이 있으면 불러오기
      useEffect(() => { goToDate(todayStr()); }, []);

      // 클라우드 기록이 처음 도착하면, 지금 보고 있는 날짜의 기록을 채워 넣기
      const filledFor = useRef(null);
      useEffect(() => {
        if (!cloudOn || !cloudRecords || filledFor.current === user.uid) return;
        filledFor.current = user.uid;
        const existing = cloudRecords.find(r => r.date === inputDate);
        if (existing) fillForm(existing);
      }, [cloudOn, cloudRecords]);

      const cloudError = e => { console.error(e); alert("클라우드에 반영하지 못했어요. 인터넷 연결을 확인해주세요.\n" + e.message); };

      const handleLogin = async () => {
        try { await fb.login(); }
        catch (e) {
          if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
          if (e.code === "auth/unauthorized-domain") { alert("이 사이트 주소가 Firebase '승인된 도메인'에 없어요.\nAuthentication → 설정 → 승인된 도메인에 추가해주세요."); return; }
          if (e.code === "auth/popup-blocked") { alert("팝업이 막혔어요. 브라우저 주소창 오른쪽에서 팝업을 허용해주세요."); return; }
          alert("로그인하지 못했어요.\n" + e.message);
        }
      };
      const handleLogout = () => { if (window.confirm("로그아웃할까요? 로그아웃하면 이 컴퓨터 기록이 보여요.")) fb.logout(); };

      // 이 컴퓨터에만 있는 기록 (클라우드에 같은 날짜가 없는 것)
      const localOnly = cloudOn && cloudRecords ? localRecords.filter(r => !cloudRecords.some(c => c.date === r.date)) : [];
      const handleUploadLocal = async () => {
        if (!window.confirm(`이 컴퓨터에만 있는 기록 ${localOnly.length}개를 클라우드에 올릴게요.\n클라우드에 이미 있는 날짜는 건드리지 않아요.`)) return;
        try { await fb.putMany(user.uid, localOnly); alert("올렸어요! 이제 다른 컴퓨터에서도 보여요 ☁️"); }
        catch (e) { cloudError(e); }
      };
      const copyUid = () => {
        const done = () => alert("계정 번호를 복사했어요.");
        if (navigator.clipboard) navigator.clipboard.writeText(user.uid).then(done, () => window.prompt("계정 번호", user.uid));
        else window.prompt("계정 번호", user.uid);
      };

      const setVal       = (key, v) => setValues(p => ({ ...p, [key]: v }));
      const toggleClosed = (key)    => setClosed(p => ({ ...p, [key]: !p[key] }));

      const sortedRecords = sortRecords(records);

      const handleSave = () => {
        const entry = { date: inputDate, values: { ...values }, closed: { ...closed, fng: fngClosed }, fng, memo };
        if (cloudOn) {
          // 화면에는 바로 반영되고, 서버 저장은 뒤에서 마무리돼요
          fb.putRecord(user.uid, entry).catch(cloudError);
        } else {
          setLocalRecords(prev => {
            const idx = prev.findIndex(r => r.date === inputDate);
            if (idx >= 0) { const n = [...prev]; n[idx] = entry; return n; }
            return sortRecords([...prev, entry]);
          });
        }
        setSaved(true); setTimeout(() => setSaved(false), 2000);
      };

      const handleNewDay = () => goToDate(todayStr());
      const loadRecord = r => { fillForm(r); setTab("input"); };

      const handleDelete = (dateToDelete) => {
        if (window.confirm(`${dateToDelete} 기록을 삭제하시겠습니까?`)) {
          if (cloudOn) fb.removeRecord(user.uid, dateToDelete).catch(cloudError);
          else setLocalRecords(prev => prev.filter(r => r.date !== dateToDelete));
          if (inputDate === dateToDelete) resetForm(inputDate);
        }
      };

      const handleExport = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "jjanto_backup.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
      };

      const handleImport = (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const raw = JSON.parse(event.target.result);
            const importedData = normalizeRecords(raw);
            if (!importedData || (raw.length > 0 && importedData.length === 0)) throw new Error("형식 오류");
            const where = cloudOn ? "클라우드" : "이 컴퓨터";
            if (records.length > 0 && !window.confirm(`${where}의 기록 ${records.length}개가 백업 파일의 기록 ${importedData.length}개로 바뀌어요. 계속할까요?`)) return;
            if (cloudOn) {
              const keep = new Set(importedData.map(r => r.date));
              await fb.removeMany(user.uid, records.map(r => r.date).filter(d => !keep.has(d)));
              await fb.putMany(user.uid, importedData);
            } else {
              setLocalRecords(importedData);
            }
            resetForm(todayStr());
            alert("백업 데이터를 성공적으로 불러왔습니다! 🥔");
          } catch (err) {
            alert("파일을 읽는 데 실패했습니다. 올바른 백업 파일인지 확인해주세요.");
          }
        };
        reader.readAsText(file);
      };

      const handleDeleteAll = () => {
        if (records.length === 0) { alert("지울 기록이 없어요."); return; }
        if (!window.confirm(`${cloudOn ? "클라우드" : "이 컴퓨터"}의 기록 ${records.length}개를 전부 지워요.\n지우기 전에 백업 파일을 먼저 저장할게요. 계속할까요?`)) return;
        handleExport();
        if (!window.confirm("백업 파일이 저장됐는지 확인해주세요.\n정말 전부 지울까요? 되돌릴 수 없어요.")) return;
        if (cloudOn) fb.removeMany(user.uid, records.map(r => r.date)).catch(cloudError);
        else setLocalRecords([]);
        resetForm(todayStr());
        alert("모든 기록을 지웠어요. 새로 시작해봐요! 🍅");
      };

      const shiftToWeekday = (direction) => {
        // direction: -1 (이전 평일), +1 (다음 평일)
        const d = parseInputDate(inputDate);
        if (!d) { handleNewDay(); return; }
        do {
          d.setDate(d.getDate() + direction);
        } while (d.getDay() === 0 || d.getDay() === 6);
        goToDate(toDateStr(d));
      };

      const fngInfo = getFng(fng);
      const weekend = isWeekend(inputDate);
      const sectionNote = { us: `${usBasisLabel(inputDate)} 미국 마감 기준`, kr: `${krBasisLabel(inputDate)} 기준`, etc: `${krBasisLabel(inputDate)} 기준` };
      const fngPrev = lastValueBefore(sortedRecords, inputDate, "fng");

      return (
        <div style={{ minHeight: "100vh", background: "#F5EFE6", fontFamily: "'Inter',sans-serif" }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
            @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
            * { box-sizing:border-box; margin:0; padding:0; } input,textarea { outline:none; } ::-webkit-scrollbar { display:none; }
          `}</style>

          <div style={{ background: "#FBF6EF", borderBottom: "1px solid #E8DDD0", padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 100 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 22 }}>🍅</span>
              <div><div style={{ fontSize: 14, fontWeight: 800, color: "#2C1A0E", letterSpacing: "-0.3px" }}>짠토와 짠감의 경제지표 공부</div><div style={{ fontSize: 11, color: "#B09880" }}>Daily 경제 기록</div></div>
            </div>
            <AccountBox fb={fb} fbFailed={fbFailed} user={user} onLogin={handleLogin} onLogout={handleLogout} />
          </div>

          <div style={{ maxWidth: 480, margin: "0 auto", padding: "20px 16px 60px" }}>
            <div style={{ display: "flex", gap: 4, marginBottom: 18, background: "#EDE4D8", borderRadius: 14, padding: 4 }}>
              {[{ id: "input", label: "✏️ 입력" }, { id: "compare", label: "📊 등락 비교" }, { id: "weekly", label: "📈 주간" }, { id: "history", label: "📁 기록" }].map(t => (
                <button key={t.id} onClick={() => setTab(t.id)} style={{ flex: 1, padding: "9px 0", borderRadius: 10, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 700, fontFamily: "Inter,sans-serif", background: tab === t.id ? "#fff" : "transparent", color: tab === t.id ? "#C0392B" : "#B09880", boxShadow: tab === t.id ? "0 2px 8px rgba(0,0,0,0.08)" : "none", transition: "all 0.2s" }}>{t.label}</button>
              ))}
            </div>

            {cloudLoading && (
              <div style={{ textAlign: "center", padding: "10px", marginBottom: 12, color: "#8B6340", fontSize: 12, fontWeight: 700, background: "#FBF6EF", borderRadius: 10, border: "1px solid #E8DDD0" }}>☁️ 클라우드 기록을 불러오는 중…</div>
            )}
            {localOnly.length > 0 && (
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "10px 14px", marginBottom: 12, background: "#FDE8E5", borderRadius: 10, border: "1px solid #FBDAD6" }}>
                <span style={{ fontSize: 11, color: "#C0392B", fontWeight: 700 }}>이 컴퓨터에만 있는 기록이 {localOnly.length}개 있어요</span>
                <button onClick={handleUploadLocal} style={{ padding: "6px 10px", borderRadius: 8, border: "none", background: "#C0392B", color: "#fff", fontSize: 11, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>☁️ 올리기</button>
              </div>
            )}

            {tab === "input" && (
              <div style={{ animation: "fadeIn 0.3s ease" }}>
                <div style={{ background: "#fff", borderRadius: 14, padding: "13px 16px", border: "1px solid #F0E8DC", marginBottom: 14, display: "flex", alignItems: "center", gap: 10, boxShadow: "0 2px 8px rgba(0,0,0,0.04)" }}>
                  <span style={{ fontSize: 18 }}>📅</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 10, color: "#B09880", marginBottom: 3, fontWeight: 600 }}>날짜</div>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <input type="date" value={inputDate.replace(/\//g, "-")} onChange={e => e.target.value && goToDate(e.target.value)} style={{ border: "none", background: "transparent", fontSize: 14, fontWeight: 700, color: weekend ? "#C0392B" : "#2C1A0E", fontFamily: "Inter,sans-serif", cursor: "pointer" }} />
                      <span style={{ fontSize: 12, fontWeight: 700, color: weekend ? "#C0392B" : "#8B6340" }}>({weekdayLabel(inputDate)})</span>
                      {weekend && <span style={{ fontSize: 10, color: "#C0392B", background: "#FDE8E5", padding: "2px 8px", borderRadius: 20, fontWeight: 700, whiteSpace: "nowrap" }}>주말 휴장</span>}
                    </div>
                  </div>
                  <button onClick={handleNewDay} style={{ padding: "6px 12px", borderRadius: 8, border: "1px solid #E8DDD0", background: "#FBF6EF", color: "#B09880", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "Inter,sans-serif" }}>오늘로</button>
                </div>

                {weekend ? (
                  <WeekendNotice inputDate={inputDate} onPrevWeekday={() => shiftToWeekday(-1)} onNextWeekday={() => shiftToWeekday(1)} />
                ) : (
                  <>
                    {SECTIONS.map(sec => (
                      <div key={sec.id} style={{ background: "#fff", borderRadius: 14, padding: "16px", border: "1px solid #F0E8DC", marginBottom: 12, boxShadow: "0 2px 8px rgba(0,0,0,0.04)" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}><span style={{ fontSize:18 }}>{sec.icon}</span><span style={{ fontSize: 13, fontWeight: 800, color: "#2C1A0E" }}>{sec.label}</span><span style={{ fontSize: 10, color: "#C0392B", background: "#FDE8E5", padding: "2px 8px", borderRadius: 20, fontWeight: 600 }}>{sectionNote[sec.id]}</span></div>
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
                          {sec.items.map((it, idx) => {
                            const isLastOdd = sec.items.length % 2 === 1 && idx === sec.items.length - 1;
                            return <div key={it.key} style={{ flex: isLastOdd ? "1 1 100%" : "1 1 calc(50% - 5px)", minWidth: 0 }}><InputCard it={it} isClosed={closed[it.key]} value={values[it.key]} onToggle={() => toggleClosed(it.key)} onChange={v => setVal(it.key, v)} prevInfo={lastValueBefore(sortedRecords, inputDate, it.key)} /></div>;
                          })}
                        </div>
                      </div>
                    ))}

                    <div style={{ background: "#fff", borderRadius: 14, padding: "16px", border: "1px solid #F0E8DC", marginBottom: 12, boxShadow: "0 2px 8px rgba(0,0,0,0.04)" }}>
                      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                          <span style={{ fontSize:13, fontWeight:800, color:"#2C1A0E" }}>🥔 공포 탐욕지수</span>
                          <span style={{ fontSize: 10, color: "#C0392B", background: "#FDE8E5", padding: "2px 8px", borderRadius: 20, fontWeight: 600 }}>{krBasisLabel(inputDate)} 기준</span>
                        </div>
                        <label style={{ display: "flex", alignItems: "center", gap: 3, cursor: "pointer", fontSize: 10, color: "#B09880" }}>
                          <input type="checkbox" checked={fngClosed} onChange={() => setFngClosed(!fngClosed)} style={{ accentColor: "#C0392B", width: 11, height: 11 }} /> 휴장
                        </label>
                      </div>
                      {fngClosed ? (
                        <div style={{ background: "#F9F5F0", borderRadius: 12, padding: "12px 14px", border: "1.5px solid #EDE4D8", textAlign: "center" }}>
                          <ClosedInfo prevInfo={fngPrev} unit="" />
                        </div>
                      ) : (
                        <>
                          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: fng ? 16 : 0 }}>
                            <div style={{ flex: 1, background: "#FBF6EF", borderRadius: 12, padding: "12px 14px", border: "1.5px solid #EDE4D8", display: "flex", alignItems: "center", gap: 8 }}><input value={fng} onChange={e => setFng(e.target.value)} placeholder="0 – 100" type="number" min="0" max="100" style={{ flex: 1, border: "none", background: "transparent", fontSize: 22, fontWeight: 800, color: "#2C1A0E", fontFamily: "Inter,sans-serif", width: "100%" }} /><span style={{ fontSize: 12, color: "#B09880" }}>/ 100</span></div>
                            {fngInfo && <div style={{ background: `${fngInfo.color}15`, borderRadius: 12, padding: "12px 16px", border: `1.5px solid ${fngInfo.color}40`, display: "flex", alignItems: "center", justifyContent: "center" }}><span style={{ fontSize: 12, fontWeight: 700, color: fngInfo.color, whiteSpace: "nowrap" }}>{fngInfo.label}</span></div>}
                          </div>
                          {fng !== "" && <div style={{ display: "flex", justifyContent: "center" }}><FearGreedGauge value={fng} /></div>}
                        </>
                      )}
                    </div>

                    <div style={{ background: "#fff", borderRadius: 14, padding: "16px", border: "1px solid #F0E8DC", marginBottom: 14, boxShadow: "0 2px 8px rgba(0,0,0,0.04)" }}>
                      <div style={{ fontSize: 13, fontWeight: 800, color: "#2C1A0E", marginBottom: 10 }}>📝 오늘의 경제 이슈</div>
                      <textarea value={memo} onChange={e => setMemo(e.target.value)} placeholder="예: 미 연준 금리 동결, 코스피 외국인 순매수 전환..." rows={3} style={{ width: "100%", border: "1.5px solid #EDE4D8", borderRadius: 10, padding: "10px 12px", fontFamily: "Inter,sans-serif", fontSize: 13, color: "#2C1A0E", background: "#FBF6EF", resize: "none", lineHeight: 1.6 }} />
                    </div>

                    <button onClick={handleSave} style={{ width: "100%", padding: 14, borderRadius: 12, border: "none", cursor: "pointer", fontWeight: 800, fontSize: 14, fontFamily: "Inter,sans-serif", background: saved ? "#7CBA78" : "linear-gradient(135deg,#E8392A,#C8650A)", color: "#fff", boxShadow: saved ? "none" : "0 4px 16px #E8392A35", transition: "all 0.3s" }}>{saved ? (cloudOn ? "☁️ 클라우드에 저장됐어요!" : "✅ 이 컴퓨터에 저장됐어요!") : "💾 오늘 기록 저장"}</button>
                  </>
                )}
              </div>
            )}

            {tab === "compare" && <div style={{ animation: "fadeIn 0.3s ease" }}><CompareTab records={records} /></div>}

            {tab === "weekly" && <div style={{ animation: "fadeIn 0.3s ease" }}><WeeklyTab records={records} /></div>}

            {tab === "history" && (
              <div style={{ animation: "fadeIn 0.3s ease" }}>
                <div style={{ background: "#FBF6EF", borderRadius: 14, padding: "12px 16px", border: "1.5px dashed #C8B0A0", marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                  <div style={{ fontSize: 11, color: "#8B6340", fontWeight: 600, lineHeight: 1.5 }}>
                    {cloudOn ? "☁️ 클라우드에 저장 중이에요" : "💻 지금은 이 컴퓨터에만 저장돼요"}<br/>
                    {cloudOn ? <span style={{ cursor: "pointer", textDecoration: "underline", color: "#B09880" }} onClick={copyUid}>🔑 계정 번호 복사</span> : "로그인하면 여러 컴퓨터에서 같이 써요"}
                  </div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    <button onClick={handleExport} style={{ padding: "6px 10px", borderRadius: 6, border: "none", background: "#8B6340", color: "#fff", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>⬇️ 백업 저장</button>
                    <button onClick={() => fileInputRef.current.click()} style={{ padding: "6px 10px", borderRadius: 6, border: "1px solid #8B6340", background: "#fff", color: "#8B6340", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>⬆️ 복원하기</button>
                    <button onClick={handleDeleteAll} style={{ padding: "6px 10px", borderRadius: 6, border: "1px solid #FBDAD6", background: "#FEF3F2", color: "#C0392B", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>🗑️ 전체 삭제</button>
                    <input type="file" ref={fileInputRef} onChange={handleImport} accept=".json" style={{ display: "none" }} />
                  </div>
                </div>

                {records.length === 0 ? (
                  <div style={{ textAlign: "center", padding: "30px 20px", color: "#B09880" }}>
                    <div style={{ fontSize: 32, marginBottom: 12 }}>📭</div><div style={{ fontSize: 14, fontWeight: 600 }}>아직 기록이 없어요</div><div style={{ fontSize: 13, marginTop: 4 }}>입력 탭에서 데이터를 저장해보세요!</div>
                  </div>
                ) : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {[...sortedRecords].reverse().map(r => {
                      const fngI = getFng(r.fng);
                      return (
                        <div key={r.date} style={{ background: "#fff", borderRadius: 14, padding: "14px 16px", border: "1px solid #F0E8DC", boxShadow: "0 2px 8px rgba(0,0,0,0.04)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                              <span style={{ fontSize: 13, fontWeight: 800, color: "#2C1A0E" }}>{r.date}({weekdayLabel(r.date)})</span>
                              {r.closed?.fng ? <span style={{ fontSize: 10, color: "#C8B0A0", fontWeight: 700, background: "#F9F5F0", padding: "2px 6px", borderRadius: 4 }}>지수 휴장</span> : (fngI && <span style={{ fontSize: 11 }}><span style={{ color: fngI.color, fontWeight: 700 }}>{r.fng}</span></span>)}
                            </div>
                            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                              {["kospi", "sp", "usdkrw"].map(k => { const it = ALL_ITEMS.find(i => i.key === k); return <span key={k} style={{ fontSize: 11, color: "#8B6340" }}>{it.label} <b style={{ color: "#2C1A0E" }}>{r.closed?.[k] ? "휴장" : fmtVal(r.values[k], it.unit)}</b></span>; })}
                            </div>
                            {r.memo && <div style={{ fontSize: 11, color: "#B09880", marginTop: 4 }}>📝 {r.memo.slice(0, 30)}{r.memo.length > 30 ? "…" : ""}</div>}
                          </div>
                          <div style={{ display: "flex", gap: 6, marginLeft: 10 }}>
                            <button onClick={() => loadRecord(r)} style={{ padding: "6px 12px", borderRadius: 8, border: "1px solid #E8DDD0", background: "#FBF6EF", color: "#8B6340", fontSize: 11, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>불러오기</button>
                            <button onClick={() => handleDelete(r.date)} style={{ padding: "6px 12px", borderRadius: 8, border: "1px solid #FBDAD6", background: "#FEF3F2", color: "#C0392B", fontSize: 11, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>삭제</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
